<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guitar lesson 0 — the missing lessons</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="tutorial">
  <h1>guitar lesson 0 — the missing lessons</h1>
  <p class="lede"><!-- the manifesto: your first lesson taught you a grip;
    nobody taught you the coordinate system. --></p>

  <section>
    <h2>0.1 The neck is a grid, not a mystery</h2>
    <p><!-- every fret is a half step; twelve then repeat; the same note lives
      in several places — why two tabs for the same song look different --></p>
    <svg data-draw="chart" data-note="B"></svg>
  </section>

  <section>
    <h2>0.2 Why the tuning is weird on purpose</h2>
    <p><!-- fourths plus the B-string wart; why shapes break crossing the B
      string; redundancy buys a stationary hand --></p>
  </section>

  <section>
    <h2>0.3 Intervals are frets</h2>
    <p><!-- distances, not note names; why the same shape works everywhere --></p>
    <svg data-draw="fretboard" data-interval="G2 M2 up" class="fb"></svg>
  </section>

  <section>
    <h2>0.4 Chords are formulas, grips are projections</h2>
    <p><!-- the four-finger G: six strings, three notes; power chord has no
      3rd; closed and spread triads before barres --></p>
    <svg data-draw="fretboard" data-chord="320033" class="fb"></svg>
    <svg data-draw="ruler" data-chord="G" class="small"></svg>
  </section>

  <section>
    <h2>0.5 Keys are neighborhoods</h2>
    <p><!-- the circle; one accidental per step; degrees over note names;
      positions are pre-chosen octave walks --></p>
  </section>

  <section>
    <h2>0.6 There are only five shapes</h2>
    <p><!-- CAGED as the punchline, not a technique --></p>
  </section>

  <p class="try"><a href="index.html">open the interactive toy →</a></p>
</main>
<script src="core.js"></script>
<script src="embed.js"></script>
</body>
</html>
