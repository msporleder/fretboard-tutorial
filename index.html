<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fretboard tutorial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div id="topbar">
    <button id="menubtn" aria-label="menu">☰</button>
    <span id="titlebar">fretboard tutorial</span>
    <span id="modelabel"></span>
    <nav id="modes">
      <button data-mode="notes" class="active">Notes</button>
      <button data-mode="circle">Circle of 5ths</button>
      <button data-mode="intervals">Intervals</button>
      <button data-mode="chords">Chords</button>
      <select id="instrumentsel" aria-label="instrument">
        <option value="guitar" selected>guitar</option>
        <option value="bass">bass</option>
      </select>
    </nav>
  </div>

  <div id="controls">
    <span class="ctl" id="ctl-notes">
      <label><input type="checkbox" id="shownames" checked> show note names</label>
      <select id="accpref" aria-label="accidentals">
        <option value="sharp" selected>♯</option>
        <option value="flat">♭</option>
      </select>
    </span>
    <span class="ctl" id="ctl-circle" hidden>
      <select id="circleshow">
        <option value="scale" selected>scale</option>
        <option value="arp">tonic arpeggio</option>
      </select>
      <select id="circlelabels">
        <option value="names" selected>note names</option>
        <option value="degrees">degrees</option>
      </select>
    </span>
    <span class="ctl" id="ctl-intervals" hidden>
      <select id="degree">
        <option value="2">2nd</option>
        <option value="3" selected>3rd</option>
        <option value="4">4th</option>
        <option value="5">5th</option>
        <option value="6">6th</option>
        <option value="7">7th</option>
        <option value="8">octave</option>
      </select>
      <select id="quality"></select>
      <select id="dir">
        <option value="1" selected>up</option>
        <option value="-1">down</option>
      </select>
    </span>
    <span class="ctl" id="ctl-chords" hidden>
      <select id="chordroot"></select>
      <select id="chordtype"></select>
      <button id="clearchord">clear</button>
    </span>
  </div>

  <p id="hint"></p>

  <svg id="fretboard" viewBox="0 0 870 200" aria-label="guitar fretboard"></svg>

  <svg id="pitchchart" viewBox="0 0 860 240" aria-label="pitch chart"></svg>

  <div id="circlewrap">
    <svg id="circle" viewBox="0 0 320 320" aria-label="circle of fifths"></svg>
  </div>

  <div id="info"></div>

  <svg id="ruler" viewBox="0 0 360 68" aria-label="degree ruler"></svg>

  <div id="voicings"></div>

  <svg id="staff" viewBox="0 -10 360 260" aria-label="music staff"></svg>
  <details>
  <summary>
  what is this page?
  </summary>
  This page is my brain dump after watching <a href="https://www.absolutelyunderstandguitar.com/">Absolutely Understand Guitar</a>'s free <a href="https://www.youtube.com/@absolutelyunderstandguitar60/courses">youtube guitar course</a><br>
  </details>
</main>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
